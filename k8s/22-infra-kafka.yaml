# Day 43 (Phase 6 — DEPLOY) — Kafka, the event backbone (KRaft mode, single node).
# ===========================================================================
# The same apache/kafka:3.8.0 KRaft broker the compose stack runs (one container is
# both broker and controller — no ZooKeeper). Lightweight + ephemeral so the demo
# stands up anywhere; advertises its Service name so in-cluster producers/consumers
# reach it at kafka:9092, matching KAFKA_BOOTSTRAP_SERVERS in the ConfigMap.
#
# ⚠️  PRODUCTION: Kafka is STATEFUL and clustered — run it as a StatefulSet with
#     persistent volumes via the Strimzi operator (or a managed Kafka / MSK / Confluent
#     Cloud), never as a single ephemeral pod. This node exists to make the stack runnable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: orderhub
  labels:
    app: kafka
    app.kubernetes.io/part-of: orderhub
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            # KRaft: this single node is BOTH broker and controller quorum.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            # Advertise the Service name so in-cluster clients reach the broker.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: orderhub
  labels:
    app: kafka
    app.kubernetes.io/part-of: orderhub
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
