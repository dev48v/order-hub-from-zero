# Day 43 (Phase 6 — DEPLOY) — API GATEWAY (Deployment + ClusterIP Service).
# ===========================================================================
# The single public front door on 8080. Two replicas — it is the edge, so it is the
# first thing to scale for availability. It is a Eureka CLIENT (no config client), so
# the ConfigMap supplies the registry address; SPRING_PROFILES_ACTIVE is overridden to
# "prod,k8s" (prod = lean logging + env-supplied registry DNS, k8s = actuator probes).
# Kept a ClusterIP here — external exposure (an Ingress in front of this Service) is
# Day 44. Image + port match the Day-42 Docker build: orderhub/api-gateway:0.1.0 on 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orderhub
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: orderhub
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  # Day 46 (Phase 6 — DEPLOY) — ZERO-DOWNTIME rollout. RollingUpdate with maxUnavailable:0
  # never drops below the desired replica count during a roll (a new pod must go Ready before
  # an old one is retired); maxSurge:1 adds one extra pod at a time. As the single public front
  # door this is the most important service to roll without a gap. minReadySeconds holds a new
  # pod "available" only after it has stayed Ready that long (rides out a flapping probe).
  # revisionHistoryLimit keeps the last N ReplicaSets so `kubectl rollout undo` can roll back.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Day 46 — DRAIN before SIGKILL. terminationGracePeriodSeconds is the TOTAL budget from
      # SIGTERM to SIGKILL; it must exceed the preStop sleep (10s) + Spring's graceful-shutdown
      # timeout (spring.lifecycle.timeout-per-shutdown-phase = 30s) so in-flight requests finish.
      terminationGracePeriodSeconds: 45
      containers:
        - name: api-gateway
          image: orderhub/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Day 46 — preStop DRAIN hook. On termination Kubernetes (a) removes the pod from the
          # Service endpoints and (b) runs this hook, in parallel. The sleep gives endpoint removal
          # time to propagate across the cluster BEFORE the app receives SIGTERM, so no new request
          # is routed to a pod that is about to stop. Only when the hook returns does SIGTERM fire
          # and Spring's graceful shutdown drains the requests already in flight.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: orderhub-config
            - secretRef:
                name: orderhub-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod,k8s"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orderhub
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: orderhub
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
