# Day 43 (Phase 6 — DEPLOY) — ORDER SERVICE (Deployment + ClusterIP Service).
# ===========================================================================
# The core bounded context on 8082. Two replicas to show horizontal scale (the
# rate-limit + idempotency stores live in the shared Redis, so multiple instances
# stay correct). It is a config client (SPRING_CONFIG_IMPORT points at the config
# server), a Eureka client, a Kafka producer/consumer, and it persists to Postgres
# — the datasource URL comes from the ConfigMap, the username/password from the
# Secret (envFrom). SPRING_PROFILES_ACTIVE = "prod,k8s". Image + port match the
# Day-42 Docker build: orderhub/order-service:0.1.0 on 8082.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orderhub
  labels:
    app: order-service
    app.kubernetes.io/part-of: orderhub
    app.kubernetes.io/component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: orderhub/order-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: orderhub-config
            - secretRef:
                name: orderhub-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod,k8s"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderhub
  labels:
    app: order-service
    app.kubernetes.io/part-of: orderhub
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
