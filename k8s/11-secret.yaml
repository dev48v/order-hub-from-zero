# Day 43 (Phase 6 — DEPLOY) — the stack's SECRETS (PLACEHOLDERS ONLY — no real values).
# ===========================================================================
# Everything sensitive lives here, apart from the plaintext ConfigMap: the HS256
# JWT signing key (Day 35), the shared inter-service token (Day 24) and the
# database credentials (Day 2). Services consume them the same two ways real
# clusters do:
#   • `envFrom: secretRef` injects every key as an environment variable into the
#     app containers (Spring relaxed-binds SPRING_DATASOURCE_USERNAME → the
#     datasource, JWT_SECRET → orderhub.security.jwt.secret, etc.).
#   • `secretKeyRef` pulls a single key on its own — the postgres Deployment does
#     this to seed POSTGRES_USER / POSTGRES_PASSWORD.
#
# ⚠️  THE VALUES BELOW ARE BASE64-ENCODED PLACEHOLDERS, NOT REAL SECRETS. base64
#     is ENCODING, not encryption — anyone can decode it. This file exists so the
#     manifest set is complete and applies cleanly; in a real cluster you would
#     NEVER commit real secrets. Generate/replace them out-of-band, e.g.
#     `kubectl -n orderhub create secret generic orderhub-secrets --from-literal=...`,
#     or manage them with Sealed Secrets / External Secrets / SOPS / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: orderhub-secrets
  namespace: orderhub
  labels:
    app.kubernetes.io/part-of: orderhub
type: Opaque
data:
  # base64("change-me-hs256-signing-secret-min-32-bytes-long")
  JWT_SECRET: Y2hhbmdlLW1lLWhzMjU2LXNpZ25pbmctc2VjcmV0LW1pbi0zMi1ieXRlcy1sb25n
  # base64("change-me-inter-service-shared-token")
  SERVICE_TOKEN: Y2hhbmdlLW1lLWludGVyLXNlcnZpY2Utc2hhcmVkLXRva2Vu
  # base64("orderhub")
  SPRING_DATASOURCE_USERNAME: b3JkZXJodWI=
  # base64("change-me-postgres-password")
  SPRING_DATASOURCE_PASSWORD: Y2hhbmdlLW1lLXBvc3RncmVzLXBhc3N3b3Jk
