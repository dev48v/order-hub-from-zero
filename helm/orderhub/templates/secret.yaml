{{/*
Day 44 (Phase 6 — DEPLOY) — the stack's Secret (was k8s/11-secret.yaml).
========================================================================
⚠️  PLACEHOLDERS ONLY. .Values.secrets.data holds base64-encoded "change-me-…" strings,
    NOT real secrets (base64 is encoding, not encryption). Gated behind secrets.create so
    a real cluster can set `--set secrets.create=false` and supply the Secret out-of-band
    (kubectl create secret / Sealed Secrets / External Secrets / SOPS / Vault) while the
    services still resolve it by name. NEVER commit real values here.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "orderhub.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secrets.data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
