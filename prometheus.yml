# Day 37 — Prometheus scrape configuration for OrderHub (Phase 5 · observability).
#
# Prometheus is PULL-based: it periodically scrapes each target's /actuator/prometheus endpoint over HTTP
# and stores every sample as a time series it can query with PromQL and alert on. Micrometer's
# PrometheusMeterRegistry renders order-service's meters at that endpoint — our custom domain meters
#   orders_placed_total{outcome="success|rejected|reservation_failed"}
#   order_processing_seconds_count / _sum / _max   (+ histogram buckets)
#   orders_open
# sit right next to the built-in JVM, HTTP-server and Resilience4j meters actuator already provides.
# (Our custom meters only appear when orderhub.observability.metrics.enabled=true.)
#
# This file is wired into the compose `prometheus` service (docker-compose.yml). It is a runtime tool and
# is NOT needed for the build/tests. Start it with `docker compose up -d prometheus` and open
# http://localhost:9090 — try PromQL like:
#   rate(orders_placed_total{outcome="success"}[1m])           # successful order rate
#   sum by (outcome) (orders_placed_total)                     # placements split by outcome
#   histogram_quantile(0.95, rate(order_processing_seconds_bucket[5m]))   # p95 placement latency
#   orders_open                                                # in-flight (placed, unconfirmed) orders

global:
  scrape_interval: 10s        # how often Prometheus pulls each target
  evaluation_interval: 10s    # how often it evaluates rules (none defined yet)

scrape_configs:
  # order-service is the only service exposing /actuator/prometheus as of Day 37. The Spring services run
  # on the HOST (compose only provides the backing stack), so we target host.docker.internal — the host as
  # seen from inside the Prometheus container — on order-service's port 8082. Add the other services'
  # targets here as they gain the Micrometer Prometheus registry.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          application: order-service
