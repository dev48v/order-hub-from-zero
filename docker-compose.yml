# OrderHub — the WHOLE system, one command.
# ===========================================================================
# Day 42 (Phase 6 — DEPLOY). Until today this file brought up only the BACKING
# INFRASTRUCTURE (Kafka, Redis, Postgres, Prometheus, Grafana, Loki) and the
# Spring services ran on the host via `mvn spring-boot:run`. Now every service
# has a production multi-stage Dockerfile (see <module>/Dockerfile), so this
# file also BUILDS and RUNS all eight of them. One command stands the entire
# stack up:
#
#     docker compose up --build            # build images + start everything
#     docker compose up -d                 # detached
#
# ── the graph (who waits for whom) ─────────────────────────────────────────
#   config-server (config)  ─┐
#   eureka-server (registry) ┤←─ every service registers/discovers here
#   kafka / redis / postgres ┘←─ the stateful middleware
#        ▼ (depends_on: service_healthy — Compose waits for the healthcheck)
#   order / inventory / payment / shipping / notification  (the services)
#        ▼
#   api-gateway  ── the single public front door on :8080
#
# Every app service joins one shared network (orderhub-net) and finds the
# others by SERVICE NAME (Docker's DNS): config at http://config-server:8888,
# the registry at http://eureka-server:8761, the broker at kafka:9092. The env
# blocks below override each service's localhost defaults with those names.
# NOTE: config/eureka env is injected ONLY into services that carry the
# matching client on their classpath, so no service ever fails to boot on an
# import it can't resolve.
services:

  # ─────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE (the stateful middleware + observability the services talk to)
  # ─────────────────────────────────────────────────────────────────────────

  # Day 25 — KAFKA. Single-node broker in KRaft mode (no ZooKeeper): one
  # container is a complete broker + controller. The event backbone every
  # producer/consumer service uses. Reachable in-network as kafka:9092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: orderhub-kafka
    ports:
      - "9092:9092"       # PLAINTEXT listener the host + services connect to
    environment:
      # --- KRaft: this node is BOTH a broker and the controller quorum ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- listeners: advertise the in-network name so services reach the broker ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- single-node: everything replicated exactly once ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # let a producer create its topic on first publish (dev convenience)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [orderhub-net]

  # Day 11 — Redis, the cache + rate-limit + idempotency store.
  redis:
    image: redis:7-alpine
    container_name: orderhub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [orderhub-net]

  # Day 2 — PostgreSQL, the production database (order-service persistence under the prod profile).
  postgres:
    image: postgres:16-alpine
    container_name: orderhub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orderhub
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub
    volumes:
      - orderhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderhub -d orderhub"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [orderhub-net]

  # Day 37 — PROMETHEUS. Metrics scraper/store. Runtime tool, not needed for the build/tests. Browse at :9090.
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: orderhub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [orderhub-net]

  # Day 38 — GRAFANA. Dashboards over Prometheus + Loki, provisioned-as-code. Browse at :3000.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: orderhub-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [orderhub-net]

  # Day 39 — LOKI. Log aggregation (the third observability pillar). Runtime tool. API on :3100.
  loki:
    image: grafana/loki:3.1.0
    container_name: orderhub-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks: [orderhub-net]

  # ─────────────────────────────────────────────────────────────────────────
  # APP SERVICES (built from each module's multi-stage Dockerfile)
  # Every `build` uses context: . (the repo root, so the whole reactor is in
  # scope) and the module's own Dockerfile.
  # ─────────────────────────────────────────────────────────────────────────

  # Day 21 — CONFIG SERVER. The single source of truth for configuration; it is
  # the ROOT of the graph (nothing it needs), so it has no depends_on. Every
  # config client below fetches its config from http://config-server:8888.
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: orderhub/config-server:0.1.0
    container_name: orderhub-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 19 — EUREKA SERVER. The service registry. Comes up after config-server.
  # It carries neither the config client nor the eureka client, so it gets no
  # config/eureka env — it just runs. Healthcheck hits the dashboard (no actuator).
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: orderhub/eureka-server:0.1.0
    container_name: orderhub-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 20 — API GATEWAY. The single public front door on :8080. Eureka client
  # (no config client), so it gets the registry address but no config import.
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: orderhub/api-gateway:0.1.0
    container_name: orderhub-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 3+ — ORDER SERVICE. The core bounded context. Runs the prod profile
  # against the compose Postgres + Redis, produces to Kafka, registers in Eureka.
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: orderhub/order-service:0.1.0
    container_name: orderhub-order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderhub
      SPRING_DATASOURCE_USERNAME: orderhub
      SPRING_DATASOURCE_PASSWORD: orderhub
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 17 — INVENTORY SERVICE. Internal-only bounded context (reached over
  # discovery, never through the gateway). Keeps its in-memory H2 — self-contained.
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: orderhub/inventory-service:0.1.0
    container_name: orderhub-inventory-service
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 27 — PAYMENT SERVICE. Event-driven: consumes OrderPlaced, emits PaymentProcessed.
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: orderhub/payment-service:0.1.0
    container_name: orderhub-payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 28 — SHIPPING SERVICE. Completes the choreography saga. It ships no local
  # config, so compose supplies its port + config/registry/broker addresses.
  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    image: orderhub/shipping-service:0.1.0
    container_name: orderhub-shipping-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks: [orderhub-net]

  # Day 41 — NOTIFICATION SERVICE. Pure event-driven consumer; notifications are
  # gated OFF by default (orderhub.notifications.enabled) so it composes cleanly.
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: orderhub/notification-service:0.1.0
    container_name: orderhub-notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks: [orderhub-net]

# One shared bridge network: every service resolves the others by service name on it.
networks:
  orderhub-net:
    driver: bridge

volumes:
  orderhub-pgdata:
