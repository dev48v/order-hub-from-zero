# OrderHub — local backing stack
# ---------------------------------------------------------------------------
# `docker compose up -d` brings up the infrastructure the services expect on
# localhost: a Kafka broker (Day 25, event-driven), plus the Redis (Day 11)
# and PostgreSQL (Day 2) the services already use. The Spring services still
# run on the host (via `mvn spring-boot:run` / your IDE); this file only
# provides the stateful middleware they talk to.
#
# Day 25 — KAFKA. A single-node broker in KRaft mode (no ZooKeeper): from
# Kafka 3.x the broker can run its own metadata quorum, so one container is a
# complete broker + controller. order-service's producer publishes an
# `OrderPlaced` event to the `order-placed` topic on every order create; the
# broker auto-creates that topic on first use. Reachable from the host on
# localhost:9092 (that is what spring.kafka.bootstrap-servers resolves to).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: orderhub-kafka
    ports:
      - "9092:9092"       # PLAINTEXT listener the host + services connect to
    environment:
      # --- KRaft: this node is BOTH a broker and the controller quorum ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- listeners: 9092 for clients, 9093 for the internal controller ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- single-node: everything replicated exactly once ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # let a producer create `order-placed` on first publish (dev convenience)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Day 11 — Redis, the cache + rate-limit + idempotency store.
  redis:
    image: redis:7-alpine
    container_name: orderhub-redis
    ports:
      - "6379:6379"

  # Day 2 — PostgreSQL, the production database (order-service persistence).
  postgres:
    image: postgres:16-alpine
    container_name: orderhub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orderhub
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub
    volumes:
      - orderhub-pgdata:/var/lib/postgresql/data

  # Day 37 — PROMETHEUS. The metrics database + scraper for Phase 5 observability. Prometheus is PULL-based:
  # on a fixed interval it GETs each target's /actuator/prometheus endpoint and stores the returned samples as
  # time series (it is a runtime tool — it does NOT need to run for the app's tests). The Spring services run
  # on the HOST (see the file header), so prometheus.yml points at host.docker.internal:8082 to reach
  # order-service on the host from inside this container (extra_hosts maps that name on Linux engines too).
  # Browse the collected series and run PromQL at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: orderhub-prometheus
    ports:
      - "9090:9090"       # Prometheus web UI + HTTP API
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Day 38 — GRAFANA. The dashboards that sit ON TOP of the Day-37 Prometheus metrics. Prometheus stores
  # the time series and answers PromQL; Grafana turns those queries into the panels an operator actually
  # watches. It is fully PROVISIONED-AS-CODE from files checked into git (grafana/provisioning + grafana/
  # dashboards): on startup Grafana reads the datasource file (wiring it to the compose `prometheus`
  # service at http://prometheus:9090) and the dashboard provider (loading grafana/dashboards/*.json), so
  # `docker compose up -d` brings the whole observability stack up identically every time — no clicking.
  # Like Prometheus it is a runtime tool and is NOT needed for the app's build/tests. depends_on ensures
  # Prometheus starts first so the datasource resolves. Browse the dashboards at http://localhost:3000
  # (anonymous viewing is on for local convenience; admin/admin for editing).
  grafana:
    image: grafana/grafana:11.1.0
    container_name: orderhub-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"       # Grafana web UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # dev convenience: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      # provisioning-as-code: datasource + dashboard provider read on startup (read-only mounts)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  orderhub-pgdata:
