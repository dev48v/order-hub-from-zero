# Day 45 (Phase 6 — DEPLOY) — a small companion workflow that LINTS the Day-44 Helm chart.
# ============================================================================
# The main pipeline (ci.yml) builds + tests the Java and images the services. This second,
# focused workflow runs `helm lint` on helm/orderhub — the check the build box could not run
# locally on Day 44 (no helm binary there), so HelmChartTest parsed the plain-YAML inputs
# instead. On a real runner we CAN install helm, so this catches template/values errors
# (bad Go templating, malformed values) that a pure-YAML parse would miss.
#
# It only runs when the chart itself changes (paths filter), so ordinary code pushes don't
# spin it up.
name: Helm Lint

on:
  push:
    branches: [master]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    branches: [master]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-lint.yml'
  workflow_dispatch:

concurrency:
  group: helm-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm lint (Day-44 chart)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install a pinned helm CLI on the runner.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      # `helm lint` renders the templates against values.yaml and reports errors/warnings.
      # --strict promotes warnings to failures so a sloppy chart can't slip through green.
      - name: Lint the chart
        run: helm lint ./helm/orderhub --strict

      # `helm template` is the stronger check: it fully RENDERS every manifest (catching
      # errors lint can miss). Piping to a file keeps the job's own output clean; the render
      # succeeding is the signal.
      - name: Render the chart (helm template)
        run: helm template orderhub ./helm/orderhub > /tmp/orderhub-rendered.yaml
