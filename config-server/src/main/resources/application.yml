# Day 21 — the Config Server's OWN configuration (how the server itself runs). This is deliberately
# separate from the config it SERVES to others (that lives under classpath:/config, see config/).
spring:
  application:
    # The server's own name — shows in logs and, if it ever registers, in the Eureka dashboard.
    name: config-server

  # The BACKEND selector. `native` tells Spring Cloud Config Server to serve config from a plain
  # filesystem/classpath location instead of cloning a git repo — the simplest, fully-reproducible
  # backend for this series (no external remote required). In production you'd switch this to the
  # default `git` backend (versioned, audited, rollback-able) or Vault (for secrets) — same server,
  # just a different profile. Setting the active profile here keeps the demo one-command-runnable.
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          # WHERE the served config files live. classpath:/config resolves to the config/ folder
          # packaged inside this module's jar (src/main/resources/config), so the whole config repo
          # ships with the server and the demo needs nothing on the host filesystem. A real native
          # setup would point at an external directory (e.g. file:./config-repo) so ops can edit
          # config without rebuilding; classpath keeps THIS reproducible.
          search-locations: classpath:/config

server:
  # The conventional Spring Cloud Config Server port. Clients point their spring.config.import at
  # http://localhost:8888 (see order-service / inventory-service), so both know where to fetch config.
  port: 8888

# Expose health so the config server is observable like every other service in the system.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# ── Day 43 (Phase 6 — DEPLOY) — KUBERNETES probe profile ──────────────────────────────────
# Activated ONLY when "k8s" is among the active profiles (the k8s ConfigMap sets
# SPRING_PROFILES_ACTIVE=native,k8s for this server). It switches on Spring Boot Actuator's
# Kubernetes health PROBES so the platform can poll them: readiness (/actuator/health/readiness)
# gates traffic into the pod, liveness (/actuator/health/liveness) gates restarts of a wedged pod.
# The `group` mappings bind each probe to Boot's built-in ApplicationAvailability states
# (readinessState / livenessState). Gated behind this profile so LOCAL / dev / test /
# docker-compose behaviour is byte-for-byte unchanged — none of those set the k8s profile.
---
spring:
  config:
    activate:
      on-profile: k8s
  # Day 46 (Phase 6 — DEPLOY) — GRACEFUL SHUTDOWN. On SIGTERM the app stops accepting NEW requests
  # but lets the ones already in flight finish (up to the timeout below) before the context closes.
  # Paired with the pod's preStop drain + terminationGracePeriodSeconds, no request is dropped during
  # a rollout. Because the k8s probes above are on, Boot ALSO flips the readiness state to
  # OUT_OF_SERVICE (REFUSING_TRAFFIC) for the whole shutdown window, so the platform stops routing at
  # once. Gated behind k8s → local / test / docker-compose shutdown is byte-for-byte unchanged.
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
